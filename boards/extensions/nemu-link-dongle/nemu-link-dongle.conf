CONFIG_USB_DEVICE_PRODUCT="nemu-link Dongle"

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_NEMU_LINK_MODE_CONTROL=y
CONFIG_ZMK_NEMU_LINK_STUDIO_ENDPOINT=y

CONFIG_NEMU_LINK_FULL_SCAN=y

# Trackball X/Y events are forwarded as separate nonblocking input messages.
# Leave room for short ESB receive bursts before the input thread drains them.
CONFIG_INPUT_QUEUE_MAX_MSGS=128
